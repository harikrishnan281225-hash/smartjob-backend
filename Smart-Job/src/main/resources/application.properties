# --- Database Connection ---
spring.datasource.url=jdbc:mysql://localhost:3306/smart_job_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useLegacyDatetimeCode=false
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA/Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# --- Hikari Connection Pool ---
spring.datasource.hikari.maximum-pool-size=10

# --- Google OAuth2 Configuration ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# --- Mail Server Configuration ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=harikrishnan281225@gmail.com
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.springframework.web=DEBUG
# Add these to your existing configuration
# This helps see if the connection pool is exhausted or failing
logging.level.com.zaxxer.hikari=DEBUG

# This ensures Hibernate logs any constraint violations that occur during INSERT
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=DEBUG